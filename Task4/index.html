<!DOCTYPE html>
<html>
<head>
    <title>Student Registration System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-center text-gray-800 text-2xl font-bold mb-6">Student Registration System</h1>
        
        <!-- Form Section -->
        <form id="registrationForm">
            <div class="mb-5">
                <label for="reg_number" class="block text-gray-700 font-bold mb-2">Registration Number:</label>
                <input type="text" id="reg_number" name="reg_number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 focus:bg-gray-50 text-sm" required>
            </div>
            <div class="mb-5">
                <label for="name" class="block text-gray-700 font-bold mb-2">Name:</label>
                <input type="text" id="name" name="name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 focus:bg-gray-50 text-sm" required>
            </div>
            <div class="mb-5">
                <label for="section_id" class="block text-gray-700 font-bold mb-2">Section ID:</label>
                <input type="text" id="section_id" name="section_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 focus:bg-gray-50 text-sm" required>
            </div>
            <div class="mb-5">
                <label for="roll_no" class="block text-gray-700 font-bold mb-2">Roll Number:</label>
                <input type="number" id="roll_no" name="roll_no" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 focus:bg-gray-50 text-sm" required>
            </div>
            <button type="submit" class="w-full py-3 bg-green-500 text-white rounded-lg font-bold cursor-pointer hover:bg-green-600 transition">Register</button>
        </form>

        <!-- Success Message Section -->
        <div id="successMessage" class="hidden mt-6 p-4 bg-green-100 border border-green-400 rounded-lg text-center">
            <h2 class="text-green-800 font-bold text-lg mb-2">Registration Successful!</h2>
            <p class="text-green-700 text-sm mb-4">Your registration has been completed successfully.</p>
            <div id="registrationDetails" class="text-left text-sm text-green-700 mb-4"></div>
            <button type="button" onclick="resetForm()" class="bg-green-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-600 transition">Register Another Student</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const successMessage = document.getElementById('successMessage');
        const registrationDetails = document.getElementById('registrationDetails');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Get form values
            const regNumber = document.getElementById('reg_number').value;
            const name = document.getElementById('name').value;
            const sectionId = document.getElementById('section_id').value;
            const rollNo = document.getElementById('roll_no').value;

            // Display registration details
            registrationDetails.innerHTML = `
                <p><strong>Registration Number:</strong> ${regNumber}</p>
                <p><strong>Name:</strong> ${name}</p>
                <p><strong>Section ID:</strong> ${sectionId}</p>
                <p><strong>Roll Number:</strong> ${rollNo}</p>
            `;

            // Hide form and show success message
            form.classList.add('hidden');
            successMessage.classList.remove('hidden');
        });

        function resetForm() {
            form.reset();
            form.classList.remove('hidden');
            successMessage.classList.add('hidden');
        }
    </script>
</body>
</html>
