version: '3'
services:
  frontend:
    build: ./frontend
    ports:
      - "3006:80"
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - database
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
